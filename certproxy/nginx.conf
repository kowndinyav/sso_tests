server {
  listen 8081;
  location = /realms/test/.well-known/jwks.json {
    proxy_pass http://host.docker.internal:8080/realms/test/protocol/openid-connect/certs;
    proxy_set_header Host $host;
  }
  location / {
    proxy_pass http://host.docker.internal:8080;
    proxy_set_header Host $host;
  }
}